services:
  - type: web
    name: earmark-agent
    runtime: node
    # Not "free": a free service spins down after 15 idle minutes, which stops the Telegram
    # long poll, the instalment nudges and the x402 sweeper, and its filesystem is wiped.
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build:web
    startCommand: pnpm --filter @earmark/agent start
    healthCheckPath: /api/health
    disk:
      name: earmark-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # node:sqlite is unflagged from Node 23.4; 22.x would need --experimental-sqlite.
      - key: NODE_VERSION
        value: "24"
      - key: DB_PATH
        value: /var/data/earmark.db
      - key: PUBLIC_URL
        value: https://earmark-agent.onrender.com
      - key: CELO_RPC_URL
        value: https://forno.celo.org
      - key: ATTRIBUTION_TAG
        value: celo_c4e6d31d42c8
      - key: EARMARK_ADDRESS
        value: "0x93316de31b4f891c56cf3b65a3f96aa6b04192ae"
      - key: ERC8004_AGENT_ID
        value: "9806"
      # Set these in the Render dashboard; never commit them.
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: X402_API_KEY
        sync: false
