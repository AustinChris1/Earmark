services:
  - type: web
    name: earmark-agent
    runtime: node
    # Free is viable only because no state lives on this instance: the database is Turso and the
    # filesystem here is disposable. A cron ping to /api/health every 10 minutes is still required,
    # or Render suspends the service after 15 idle minutes and the bot, nudges and sweeper stop.
    plan: free
    region: frankfurt
    branch: main
    # pnpm is installed explicitly: Render's Node runtime does not document pnpm detection,
    # so relying on corepack or a lockfile sniff would be a build that works by luck.
    # Only the agent and web workspaces are installed. Hardhat never runs here, and skipping it
    # avoids compiling keccak and secp256k1 on the build host for no reason.
    buildCommand: npm i -g pnpm@11.25.0 && pnpm install --frozen-lockfile --filter @earmark/agent --filter @earmark/web && pnpm --filter @earmark/web build
    startCommand: pnpm --filter @earmark/agent start
    healthCheckPath: /api/health
    envVars:
      # node:sqlite is not used any more, but Node 24 is what the code is tested against.
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_URL
        value: https://earmark-agent.onrender.com
      # Chainstack is the primary endpoint; the agent falls back to Forno on its own.
      # Set this in the dashboard, not here: a Chainstack URL carries its key in the path.
      - key: CELO_RPC_URL
        sync: false
      - key: CELO_RPC_FALLBACK
        value: https://forno.celo.org
      # What the browser is told to use. Never the keyed endpoint.
      - key: PUBLIC_RPC_URL
        value: https://forno.celo.org
      - key: ATTRIBUTION_TAG
        value: celo_c4e6d31d42c8
      - key: EARMARK_ADDRESS
        value: "0x93316de31b4f891c56cf3b65a3f96aa6b04192ae"
      - key: ERC8004_AGENT_ID
        value: "9806"
      # Set these in the Render dashboard; never commit them.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: X402_API_KEY
        sync: false
      # Self gate. Leave unset until the on-chain flow exists; the bot then does not enforce it.
      - key: SELF_SBT_ADDRESS
        sync: false
      - key: SELF_API_KEY
        sync: false
      - key: SELF_FLOW_ID
        sync: false
      # Optional. Without it /new keeps using its guided prompts instead of reading a sentence.
      - key: CENCORI_API_KEY
        sync: false
