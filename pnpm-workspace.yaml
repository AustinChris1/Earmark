packages:
  - contracts
  - agent
  - web
  - askbots

# pnpm 11 blocks dependency install scripts until they are approved, and with CI=true an
# ignored build is a hard failure rather than a warning. pnpm 11.25 reads `allowBuilds`;
# `onlyBuiltDependencies` is silently ineffective here, verified against a fresh install.
# esbuild unpacks vite's binary. keccak and secp256k1 are hardhat's and are local only,
# since the deploy installs the agent and web workspaces alone.
allowBuilds:
  esbuild: true
  keccak: true
  secp256k1: true

minimumReleaseAgeExclude:
  - askbots@0.2.0
