packages:
  - contracts
  - agent
  - web

# pnpm 11 blocks dependency install scripts until they are named here, and with CI=true
# an ignored build is a hard failure rather than a warning.
# esbuild unpacks a prebuilt binary for vite; keccak and secp256k1 are hardhat's, local only.
onlyBuiltDependencies:
  - esbuild
  - keccak
  - secp256k1
