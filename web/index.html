<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Earmark</title>
    <meta name="description" content="A group chat pools money for one named obligation, and the agent can only pay the destination it was locked to." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/icon-prosperity-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Earmark" />
    <meta property="og:title" content="Earmark" />
    <meta property="og:description" content="A group chat pools money for one named obligation, and the agent can only pay the destination it was locked to." />
    <meta property="og:image" content="https://earmark-agent.onrender.com/brand/og-dark.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Earmark" />
    <meta name="twitter:description" content="A group chat pools money for one named obligation, and the agent can only pay the destination it was locked to." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      (() => {
        const saved = localStorage.getItem("earmark-theme");
        const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
